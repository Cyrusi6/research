[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "auto-research"
version = "0.1.0"
description = "A file-managed multi-stage auto research system for idea-to-paper workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Codex" }
]
dependencies = [
  "openai>=1.40.0",
  "PyYAML>=6.0.1",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
auto-research = "auto_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
