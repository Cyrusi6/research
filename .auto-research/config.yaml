project:
  target_venue: "NeurIPS 2026"
  language: "en"
  workspace_root: "workspace"
  external_resource_roots:
    mm_root: "${MM_ROOT}"

llm:
  provider: "codex_cli"
  reasoning_provider: "openai"
  execution_provider: "none"
  # Force OpenAI/Codex calls to use the primary OpenAI key only.
  api_key_env: "OPENAI_API_KEY"
  disable_api_key_fallback: true
  model: "gpt-5.4"
  temperature: 0.2
  timeout_seconds: 1800
  default_headers:
    User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36"
    Accept: "application/json"
  use_real_api: true
  json_retries: 3
  codex_cli:
    use_resume: true
    session_strategy: "per_agent"
    sandbox: "danger-full-access"
    approval_policy: "never"

agents:
  literature_scout:
    model: "gpt-5.4"
    temperature: 0.2
  rebuttal_analyst:
    model: "gpt-5.4"
    temperature: 0.1
  method_inventor:
    model: "gpt-5.4"
    temperature: 0.5
  skeptic_reviewer:
    model: "gpt-5.4"
    temperature: 0.1
  systems_feasibility:
    model: "gpt-5.4"
    temperature: 0.1
  experiment_designer:
    model: "gpt-5.4"
    temperature: 0.2
  meta_judge:
    model: "gpt-5.4"
    temperature: 0.1
  c2c-posthoc-reviewer:
    model: "gpt-5.4"
    temperature: 0.1

literature:
  semantic_scholar_api_key: "${SEMANTIC_SCHOLAR_API_KEY}"
  max_papers: 12
  arxiv_max_results: 8
  recent_years: 2
  download_pdfs: true
  request_timeout_seconds: 20

intake:
  semantic_enrichment:
    enabled: true
    provider: "deepseek"
    model: "deepseek-v4-flash"
    base_url: "https://api.deepseek.com"
    limit: 6
    source_types: ["paper", "rebuttal", "code"]
    max_input_chars: 6000
    code_max_input_chars: 3000
    max_tokens: 1200
    code_max_tokens: 500
    temperature: 0.1
    dry_run: false

plan:
  min_hypotheses: 1
  min_baselines: 2
  min_datasets: 1
  require_ablation: true
  require_resource_budget: true

experiment:
  simulate: false
  disable_llm_during_execution: true
  gpu_ids: "auto"
  gpu_policy:
    max_gpus: 6
    min_free_mb: 0
  max_concurrent_jobs: 2
  timeout_hours: 24
  checkpoint_interval_min: 30
  random_seeds: [42, 123, 456]
  auto_reduce_batch_on_oom: true
  self_heal:
    enabled: true
    max_attempts: 3
  cleanup_failed_idea_runs: true
  failure_log_filename: "failure.md"

c2c:
  small_loop:
    proxy_screen:
      enabled: true
      mode: "replay"
      train_samples: 128
      eval_limit: 64
      eval_datasets: ["mmlu-redux", "ai2-arc", "openbookqa"]
      commands: []
      gpu_policy:
        gpu_ids: "auto"
        max_gpus: 1
        min_free_mb: 18000
        max_utilization_gpu: 40
        respect_resource_filters: true
        disable_resource_fallback: true
        resource_wait:
          enabled: true
          timeout_seconds: 7200
          poll_seconds: 120
      static_hard_gate: true
      reject_on_command_failure: true
      reject_if_no_executable_change: true
      reject_eval_code_changes: true
      reject_test_only_changes: true
      require_proxy_metrics: true
      require_paired_baseline: true
      run_baseline_if_missing: true
      allow_configured_baseline_fallback: true
      min_proxy_mean_delta: -0.3
      repair_soft_proxy_fail: false
      soft_proxy_mean_delta: -0.1
      max_proxy_dataset_regression: 1.5
      soft_max_proxy_dataset_regression: 0.75
      proxy_score_regression_weight: 0.5
      risk_penalty_per_label: 0.05
      min_proxy_score:
      soft_min_proxy_score: -0.3
      allow_neutral_proxy_full_s3: true
      neutral_proxy_min_delta: -0.1
      neutral_proxy_max_dataset_regression: 0.25
      baseline_cache_path: "experiment/results/c2c_proxy_baseline.json"
      activation_smoke:
        enabled: true
        hard_gate: true
        require_ablation_switch: true
        max_datasets: 1
        min_abs_metric_delta: 0.01
        min_prediction_diff_rate: 0.01
        min_answer_diff_rate: 0.01
        min_mean_output_length_delta: 1.0
        require_observable_difference: true

code_patch:
  enabled: true
  backend: codex_persistent_cli
  persistent_session: true
  use_git_worktree: true
  worktree_storage_root: "~/.cache/auto-research/code-worktrees"
  worktree_base_ref: 113c3a9b2538cbf096a0477e1ec99ae2a2e0d12a
  codex_json_events: true
  no_progress_timeout_seconds:
  timeout_seconds: 1800
  max_candidates: 3
  codex_preload_sandbox: danger-full-access
  codex_sandbox: danger-full-access
  codex_sandbox_fallback: danger-full-access
  codex_approval_policy: never
  validation:
    require_py_compile: true
    require_targeted_tests: true
    runtime_smoke:
      enabled: true
      train_samples: 8
      timeout_seconds: 600
      gpu_ids: [0]
      skip_if_missing_train_entry: true
      mechanism_activation:
        enabled: true
        require_switch_in_disabled_eval_config: true
        require_switch_referenced_in_runtime_code: true
        runtime_code_files:
          - "rosetta/model/aligner.py"
          - "rosetta/model/projector.py"
          - "rosetta/model/wrapper.py"
  dynamic_whitelist:
    include_prefixes: ["rosetta/", "script/", "recipe/", "test/", "tests/"]
    include_extensions: [".py", ".json", ".yaml", ".yml", ".toml", ".txt"]
    include_root_globs: ["pyproject.toml", "requirements*.txt"]
    exclude_prefixes: [".git/", "wandb/", "__pycache__/", "local/checkpoints/", "local/snapshots/", "local/final_results/", "data/", "datasets/", "models/"]
    exclude_extensions: [".pt", ".pth", ".safetensors", ".bin", ".ckpt", ".parquet", ".arrow"]

ideation:
  challenge_target_rsum: 507.0
  max_regeneration_rounds: 3
  debate:
    enabled: true
    parallel: true
    rounds: 2
    agent_timeout_seconds: 1200
    role_timeout_seconds:
      rebuttal_analyst: 1500
      method_inventor: 1500
      skeptic_reviewer: 1500
      systems_feasibility: 1500
    meta_timeout_seconds: 1800

writing:
  template: "neurips2026"
  page_limit: 10
  compile_engine: "pdflatex"
  require_compile: false
  claim_verification:
    enabled: true
    min_pass_rate: 0.8

review:
  pass_threshold: 7.0
  max_iterations: 5

hitl:
  enabled: true
  mode: "feishu"             # "feishu" | "cli_only"
  blocking: true             # if true, pipeline blocks until human responds
  timeout_minutes: 60
  feishu:
    app_id: "${FEISHU_APP_ID}"
    app_secret: "${FEISHU_APP_SECRET}"
    user_open_id: "${FEISHU_USER_OPEN_ID}"   # preferred; leave empty to lookup by email
    user_email: "${FEISHU_USER_EMAIL}"
  approval_stages:            # which stages require human approval
    - "S2_plan"
    - "S4_writing"

orchestration:
  auto_mode: false            # auto_mode=false means HITL is active
  user_confirm_idea: false
  per_stage_judge: true
  judge_max_retries: 2
  failure_feedback:
    enabled: true
    route_s3_failure_to_s1: true
    early_stop:
      enabled: false
      min_iterations: 3
      patience: 3
      stop_if_best_delta_below: -0.5
